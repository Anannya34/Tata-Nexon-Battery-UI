[tool.poetry]
name = "battery-rul-prediction"
version = "2.0.0"
description = "Professional Battery RUL Prediction System with Advanced ML"
authors = ["MystiFoe <mystifoe@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
streamlit = "^1.28.2"
pandas = "^2.1.3"
numpy = "^1.25.2"
scikit-learn = "^1.3.2"
torch = "^2.1.1"
xgboost = "^2.0.2"
matplotlib = "^3.8.2"
seaborn = "^0.13.0"
plotly = "^5.17.0"
pydantic = "^2.5.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
python-dotenv = "^1.0.0"
loguru = "^0.7.2"
joblib = "^1.3.2"
optuna = "^3.4.0"
redis = "^5.0.1"
httpx = "^0.25.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
black = "^23.11.0"
isort = "^5.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"